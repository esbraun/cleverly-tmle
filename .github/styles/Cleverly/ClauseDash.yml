extends: existence
message: "Use a full stop, comma, parentheses, or a table instead of '%s'."
level: error
scope: text
# Without this, Vale wraps each token in a word boundary.  An em dash is not a word
# character, so that boundary can never be satisfied and the rule passes on every file
# it reads.  `tests/unit/test_documentation_prose.py` is the witness that it fires.
nonword: true
tokens:
  - '—'
  - ' -- '
