name: drtmle-companion-grid

# Dispatch only, for the reason `drtmle-coverage.yml` is: this is a measurement rather than a
# check, and it asserts nothing.
#
# **What it measures is the instrument and not the estimator.** docs/roadmap.md's E1b: C3c read
# `sqrt(n) R_remaining` as flat, and the reading could not separate the estimator's own
# sampling spread from the evaluation rule's error, which lands directly in every replicate's
# remainder and is then multiplied by `sqrt(n)`. This measures each rule's own error and the
# share of the column it accounts for. A rule's error, however well measured, says nothing
# whatever about the remainder, and no table here is a coverage claim.
#
# **The measurement is by replication, which is E1b's correction to E1.** Each fit's companion
# holds several independent scrambles of the quasi-random rule and several independent i.i.d.
# draws, so each rule's error is the spread across its own replicates *at a fixed fit* -- a
# standard error, assuming no convergence rate. E1 read the movement between two grid
# refinements as a bound on that error, which a successive difference cannot be, and read
# `1 - s²/s²_control` as a share, which a ratio of two marginal variances is not.
#
# **It is still one fit per draw.** Every replicate of both rules is a row block of one stacked
# companion, addressed by a window -- so nothing here is a refit, and a spread across
# replicates carries only the rule.
#
# Read `rule sd` and `share` first, and read `share 90%` rather than `share`. `delta` is a
# stability diagnostic and is not an error bound; the module prints why.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: "space-separated: q-drift g-drift"
        default: "q-drift g-drift"
      sizes:
        description: >-
          space-separated sample sizes. Two is enough here -- the rule's error is a property of
          the grid rather than of n, and the sizes are there to show the share is not
        default: "600 2400"
      points:
        description: >-
          the ladder, in Sobol points, each a power of two so the grids nest within a scramble.
          Only the finest costs companion rows; the rest are windows on the same blocks
        default: "512 1024 2048"
      scrambles:
        description: >-
          independent randomisations of the quasi-random rule per fit. This is what measures
          that rule's own error; below 2 there is no spread and the column reads nan
        default: "8"
      control_n:
        description: >-
          rows of each i.i.d. companion the rule is read against. 2000 is what C3c ran, so the
          control is the recorded configuration rather than a convenient one
        default: "2000"
      draw_replicates:
        description: >-
          independent i.i.d. companions per fit, which measure that rule's error the same way
          rather than through the sd(D)/sqrt(m) formula
        default: "8"
      draws:
        description: >-
          draws per (cell, size). The rule's error is conditional on a fit, so this sizes the
          *share* and its interval rather than the rule's own error
        default: "16"
      jobs:
        description: "parallel draws; each fit is single-threaded, and 2 fits the runner"
        default: "2"
      seed:
        default: "20250801"
      tier:
        description: >-
          2 is the tier the study's numbers are quoted from and is the default here for that
          reason; 1 is cheaper and is where the reading can be checked against an exact
          quadrature over a prescribed sequence
        default: "2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      # One job per (cell, size) rather than per cell. The companion now holds every replicate
      # of both rules -- tens of thousands of rows against E1's few thousand -- so a job
      # carrying both sizes of the expensive tier would run at the timeout.
      - id: split
        env:
          CELLS: ${{ inputs.cells }}
          SIZES: ${{ inputs.sizes }}
        run: |
          printf 'matrix=' >> "$GITHUB_OUTPUT"
          jq -cn '[
            (env.CELLS | split(" ") | map(select(length > 0))[]) as $cell
            | (env.SIZES | split(" ") | map(select(length > 0))[]) as $size
            | {cell: $cell, size: $size}
          ]' >> "$GITHUB_OUTPUT"

  grid:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # One fit a draw, whose companion is `scrambles * 2 * points + draw_replicates * control_n`
    # rows -- a prediction per fold per nuisance each and no learner fit. Generous rather than
    # tight for the reason `drtmle-coverage.yml` gives: the script prints nothing until every
    # draw has returned.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      # `bash -euo pipefail` rather than the default, since the run is piped through `tee`:
      # without it a crashed run exits on `tee`'s zero and reports a green job with a
      # truncated log.
      - shell: bash -euo pipefail {0}
        env:
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
          POINTS: ${{ inputs.points }}
          SCRAMBLES: ${{ inputs.scrambles }}
          CONTROL_N: ${{ inputs.control_n }}
          DRAW_REPLICATES: ${{ inputs.draw_replicates }}
          DRAWS: ${{ inputs.draws }}
          JOBS: ${{ inputs.jobs }}
          SEED: ${{ inputs.seed }}
          TIER: ${{ inputs.tier }}
        run: >
          python -m benchmarks.drtmle_companion_grid
          --cells "$CELL"
          --sizes "$SIZE"
          --points $POINTS
          --scrambles "$SCRAMBLES"
          --control-n "$CONTROL_N"
          --draw-replicates "$DRAW_REPLICATES"
          --draws "$DRAWS"
          --jobs "$JOBS"
          --seed "$SEED"
          --tier "$TIER"
          | tee "companion-grid-$CELL-$SIZE.log"

      - name: Post the tables to the run summary
        if: always()
        env:
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
        run: |
          {
            echo "## drtmle-companion-grid: tier ${{ inputs.tier }}, $CELL, n = $SIZE"
            echo '```text'
            cat "companion-grid-$CELL-$SIZE.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The per-replicate rows are the evidence and the tables are a transcription of them.
      # E1's numbers came from a sandbox whose rows were git-ignored and are gone, which is
      # why docs/drtmle/study-manifest.md records this artefact's id and digest.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-companion-grid-${{ matrix.cell }}-${{ matrix.size }}
          path: |
            benchmarks/results/drtmle-companion-grid/
            companion-grid-${{ matrix.cell }}-${{ matrix.size }}.log
          retention-days: 90
