name: manual-validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Long-running validation to execute
        type: choice
        options: [statistical, documentation]
        default: statistical
      selection:
        description: Optional pytest node id for statistical validation
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      - name: Size the worker pool from the cores this job may actually use
        run: |
          echo "PYTEST_XDIST_AUTO_NUM_WORKERS=$(python -m tests.parallel --workers)" >> "$GITHUB_ENV"
          python -m tests.parallel
      - name: Statistical validation
        if: inputs.suite == 'statistical'
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          if [ -n "$SELECTION" ]; then
            pytest "$SELECTION" -q -n auto --durations=20
          else
            pytest -m slow -q -n auto --durations=20
          fi
      - name: Intentional documentation review
        if: inputs.suite == 'documentation'
        run: |
          ruff check README.md docs
          ruff format --check README.md docs
