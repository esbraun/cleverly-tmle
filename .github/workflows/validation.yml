name: manual-validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Long-running validation to execute
        type: choice
        options: [statistical, documentation]
        default: statistical
      selection:
        description: Optional pytest node id for statistical validation
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      - name: Size the worker pool from the cores this job may actually use
        run: |
          echo "PYTEST_XDIST_AUTO_NUM_WORKERS=$(python -m tests.parallel --workers)" >> "$GITHUB_ENV"
          python -m tests.parallel
      - name: Statistical validation
        if: inputs.suite == 'statistical'
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          if [ -n "$SELECTION" ]; then
            pytest "$SELECTION" -q -n auto --durations=20
          else
            pytest -m slow -q -n auto --durations=20
          fi
      # A convenience entry point for a maintainer reviewing the prose, not a gate: every
      # check below also runs unconditionally, the tests in the fast tier and the formatter
      # in `ci.yml`'s lint job. Enforcement lives there.
      #
      # `ruff check` is deliberately absent. The linter does not read markdown -- pointed at
      # `README.md` it reports "No Python files found" and exits zero -- so naming it here
      # would read as a documentation check while validating nothing. The formatter does
      # reach inside `python` fences, but skips any block it cannot parse, which is why the
      # example syntax check is a test rather than a ruff invocation.
      - name: Intentional documentation review
        if: inputs.suite == 'documentation'
        run: |
          pytest tests/unit/test_documentation_links.py tests/unit/test_documentation_examples.py -q
          ruff format --check .
