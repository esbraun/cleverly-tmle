name: pages

# The site follows releases, not every merge. Deploying on each push to `main` made one GitHub
# deployment record per merged pull request (about 420 by November 2026). It now deploys after
# `publish.yml` succeeds, from the released commit, and on a manual run from `main` when the
# site needs a fix between releases. The `docs` job in `ci.yml` still builds the site on every
# pull request, so a broken build fails before the merge.
#
# `workflow_run` and `workflow_dispatch` both run with `main` as the workflow ref, which the
# `github-pages` environment allows; a tag-push trigger would depend on that environment's
# branch policy accepting tags.
on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install documentation dependencies
        run: uv sync --locked --extra docs
      - name: Build documentation
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
