name: drtmle-reference

# Dispatch only, for the reason `drtmle-coverage.yml` and `drtmle-companion-grid.yml` are: this
# is a measurement rather than a check, and it asserts nothing.
#
# **What it decides.** docs/roadmap.md's E2, repaired as its E2R, which is piece E's branch
# point. C3c read `sqrt(n) R_remaining` as flat with the three reduced regressions fitted by
# `glm`, a configuration whose own consistency the concordance marks `unverified` -- so the study
# tested Theorem 1's conclusion without establishing its premise. This refits both cells with the
# reductions at their population limits and reads the paired difference against a margin frozen
# in docs/drtmle/validation-plan.md section 8, before this workflow existed. If the reference
# does not move the column, candidate 1 is dead, the learner road is shut and the diagnosis
# moves to E3; if it does, E2b fires. `unresolved` is a third verdict and is not a weak "dead".
#
# **E2 ran at this workflow's own defaults and did not decide** (run 31042558057): three cells of
# four came back `unresolved`, every one on gate B's clause that no other rung may beat the
# shipped reference. So the rung is no longer shipped: the control arm RANKS the rungs at its own
# exit state -- a targeted state no candidate's fit produced -- and the reference arm is then
# fitted at what that ranking SELECTED, on four blocks rather than three, because a rung certified
# by the block that chose it is a rung that certified itself. Read the selection table before the
# gates: every number under it is conditional on which rung each regression was fitted at.
#
# **It takes TWO dispatches, and the gap between them is a commit.** `phase: select` fits the
# selection cohort and writes `selection.json`; that file is committed to
# `evidence/e2r-selection/`; `phase: decide` fits the DECISION cohort -- a disjoint set of
# simulation draws -- at the committed mapping and reads the gates and the comparison. Four
# disjoint quadrature blocks split the *integration* noise and do not make an audit independent of
# a data-dependent selection: the draw is the independent unit here, so the draws have to be
# disjoint too, and `validate_selection` refuses a decision run whose draws are the ones the
# manifest recorded. The decision command cannot select, and a `decide` run whose artefact set is
# incomplete exits NON-ZERO with its diagnostic rows written.
#
# **Read the gate table second, and it is the last thing that would be added under pressure.**
# A reference is a numerical estimate and not an oracle: what is left after the construction is
# a smoothing bias and a finite point count, and a paired number read before those are bounded
# is not evidence about the reduction learner. Gate B is a held-out weighted risk against an
# independent finer block -- a DIFFERENCE of risks, never a ratio, because a risk carries the
# irreducible variance of its own target and that part is common to every candidate. It is now
# read on FIVE metrics: the three reduced regressions, and the two composites the fit's
# correction actually divides by, `q_r/g` and `g_r2/g_r1` at the bounded denominators. Gate C is
# the reference's own across-scramble spread. A cell whose gates fail reads `unresolved`
# however large its difference is, and the module prints why.
#
# **Neither gate is a refinement difference**, which is the statistic this repository withdrew
# twice -- once for the quadrature ladder and once for the binned branches. The third gate is an
# exact-law control and is a test rather than a column: it runs in CI on every commit.
#
# The environment this repository is developed in cannot run a study (see CLAUDE.md), so this is
# how E2R's numbers get produced.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: >-
          `select` fits the selection cohort and writes the mapping; `decide` fits the decision
          cohort at the committed mapping and reads the gates. Run `select`, COMMIT the manifest
          it uploads to evidence/e2r-selection/selection.json, then run `decide`
        type: choice
        options: ["select", "decide"]
        default: "select"
      selection:
        description: >-
          `decide` only: the committed manifest to read the rungs from. A decision run that
          could also select would be choosing on the draws it decides on
        default: "evidence/e2r-selection/selection.json"
      cells:
        description: "space-separated: q-drift g-drift (both is the design; one is a debug run)"
        default: "q-drift g-drift"
      sizes:
        description: >-
          space-separated sample sizes. Two, because this is a comparison rather than a rate --
          item 13 is a rate and closes at E5
        default: "600 2400"
      selection_draws:
        description: >-
          draws per (cell, size) in the SELECTION cohort, which fits the control arm alone and
          ranks the ladder on it. 16 is above the twelve the sizing pilot ranked at
        default: "16"
      decision_draws:
        description: >-
          draws per (cell, size) in the DECISION cohort, DISJOINT from the selection cohort's.
          This sizes the paired interval, which is what the margin is read against, AND the
          simultaneous bound every gate-B fidelity clause is read at; 32 is what E2 dispatched at
        default: "32"
      reference_points:
        description: >-
          Sobol points the reduced regressions are fitted on. Sized by the reference's own
          points-per-parameter budget, which it refuses to be fitted thinner than -- spline(32)
          needs 2,240 rows and qr's mask keeps about half a block. 8192 rather than E2's 4096,
          because E2R's declared LEVER was pulled and its falsifier did not fire: a twelve-draw
          pilot selected the same rungs at both sizes, so the winners are about the function --
          and the doubling took the audit's one failing qr clause from a resolved -7.6e-07 to a
          -3.0e-07 straddling zero, for 52.2s a fit against 45.8s
        default: "8192"
      selection_points:
        description: >-
          Sobol points the rung is SELECTED on, from a disjoint scramble stream. Finer than the
          fitting block on purpose: a held-out risk carries its own error and nothing pairs it
          away
        default: "8192"
      audit_points:
        description: >-
          Sobol points gate B CERTIFIES on, from a stream disjoint from the selection's. A rung
          certified by the block that chose it is a rung that certified itself
        default: "8192"
      evaluation_points:
        description: "Sobol points the remainder is integrated on, per evaluation scramble"
        default: "2048"
      evaluation_scrambles:
        description: >-
          independent randomisations of the evaluation rule, averaged into one reading per fit.
          Both arms read the same ones, so this sharpens the pair rather than one side of it
        default: "2"
      budget_scrambles:
        description: >-
          gate C: independent reference scrambles on a budget draw. Each is a REFIT, unlike an
          evaluation replicate, so this multiplies the cost of those draws
        default: "4"
      budget_draws:
        description: "how many draws carry the budget. The first few of the stream, not a subset"
        default: "4"
      jobs:
        description: "parallel draws; each fit is single-threaded, and 2 fits the runner"
        default: "2"
      seed:
        default: "20250801"
      tier:
        description: >-
          2 is the tier C3c's numbers are quoted from and is the default here for that reason;
          1 is cheaper and injects both primaries, so the three reductions are the whole of what
          a learner is being asked to fit
        default: "2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      # `decide` splits one job per (cell, size): a draw buys two fits and a budget draw buys
      # several, so a job carrying both sizes of the expensive tier would run at the timeout.
      #
      # `select` is ONE job over the whole grid, and that is not an optimisation -- it is what
      # makes the manifest one file. The mapping has to be committed as a single artefact before
      # any deciding number exists, and four jobs would each write a quarter of it and leave the
      # merge to a hand. It affords the width because it is the cheap pass: the control arm only,
      # at `selection_draws` rather than `decision_draws`, with no budget refits.
      - id: split
        env:
          CELLS: ${{ inputs.cells }}
          SIZES: ${{ inputs.sizes }}
          PHASE: ${{ inputs.phase }}
        run: |
          printf 'matrix=' >> "$GITHUB_OUTPUT"
          jq -cn 'if env.PHASE == "select" then
            [{cell: env.CELLS, size: env.SIZES, label: "select"}]
          else [
            (env.CELLS | split(" ") | map(select(length > 0))[]) as $cell
            | (env.SIZES | split(" ") | map(select(length > 0))[]) as $size
            | {cell: $cell, size: $size, label: ($cell + "-" + $size)}
          ] end' >> "$GITHUB_OUTPUT"

  reference:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # `decide` buys two fits a draw, plus `budget_scrambles - 1` more on each budget draw, each
    # carrying a companion of `reference + selection + audit + evaluation` rows -- half again as
    # many rows as E2's three blocks, which is what splitting the scoring block costs. `select`
    # buys one arm a draw over the whole grid at the smaller cohort. Generous rather than tight
    # for the reason `drtmle-coverage.yml` gives: the script prints nothing until every draw
    # returns.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      # `bash -euo pipefail` rather than the default, since the run is piped through `tee`:
      # without it a crashed run exits on `tee`'s zero and reports a green job with a
      # truncated log. That matters more since E2R's repair than it did before it: an
      # incomplete `decide` run exits NON-ZERO on purpose, and `tee`'s status would swallow it.
      - shell: bash -euo pipefail {0}
        env:
          PHASE: ${{ inputs.phase }}
          SELECTION: ${{ inputs.selection }}
          LABEL: ${{ matrix.label }}
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
          SELECTION_DRAWS: ${{ inputs.selection_draws }}
          DECISION_DRAWS: ${{ inputs.decision_draws }}
          REFERENCE_POINTS: ${{ inputs.reference_points }}
          SELECTION_POINTS: ${{ inputs.selection_points }}
          AUDIT_POINTS: ${{ inputs.audit_points }}
          EVALUATION_POINTS: ${{ inputs.evaluation_points }}
          EVALUATION_SCRAMBLES: ${{ inputs.evaluation_scrambles }}
          BUDGET_SCRAMBLES: ${{ inputs.budget_scrambles }}
          BUDGET_DRAWS: ${{ inputs.budget_draws }}
          JOBS: ${{ inputs.jobs }}
          SEED: ${{ inputs.seed }}
          TIER: ${{ inputs.tier }}
        run: |
          # `$CELL` and `$SIZE` are deliberately unquoted: on the `select` phase they carry the
          # whole space-separated grid, which is one job and one manifest.
          args=(
            --phase "$PHASE"
            --cells $CELL
            --sizes $SIZE
            --selection-draws "$SELECTION_DRAWS"
            --decision-draws "$DECISION_DRAWS"
            --reference-points "$REFERENCE_POINTS"
            --selection-points "$SELECTION_POINTS"
            --audit-points "$AUDIT_POINTS"
            --evaluation-points "$EVALUATION_POINTS"
            --evaluation-scrambles "$EVALUATION_SCRAMBLES"
            --budget-scrambles "$BUDGET_SCRAMBLES"
            --budget-draws "$BUDGET_DRAWS"
            --jobs "$JOBS"
            --seed "$SEED"
            --tier "$TIER"
          )
          # No `--allow-fallback` on either branch, and that is the point of the flag existing:
          # a dispatch that could fall back to a rung nothing selected is a dispatch that can
          # certify one.
          if [ "$PHASE" = "decide" ]; then
            args+=(--selection "$SELECTION")
          fi
          python -m benchmarks.drtmle_reference_study "${args[@]}" | tee "reference-$LABEL.log"

      - name: Post the tables to the run summary
        if: always()
        env:
          LABEL: ${{ matrix.label }}
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
        run: |
          {
            echo "## drtmle-reference ${{ inputs.phase }}: tier ${{ inputs.tier }}, $CELL, n = $SIZE"
            echo '```text'
            cat "reference-$LABEL.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The per-fit and per-candidate rows are the evidence and the tables are a transcription
      # of them. docs/drtmle/study-manifest.md records each artefact's id and digest, which is
      # the standing decision E1's lost sandbox output is the evidence for.
      #
      # On the `select` phase this artefact carries `selection.json`, which is the ONE file to
      # take out of the run: commit it to evidence/e2r-selection/ before dispatching `decide`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-reference-${{ inputs.phase }}-${{ matrix.label }}
          path: |
            benchmarks/results/drtmle-reference/
            reference-${{ matrix.label }}.log
          retention-days: 90
