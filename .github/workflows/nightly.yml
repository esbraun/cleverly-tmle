name: nightly

on:
  schedule:
    # 07:00 UTC daily - the statistical validation tier (coverage, consistency,
    # type I error) is too slow for per-PR CI.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      selection:
        # The whole tier is ~1 hour, which makes "run the one case I changed" a
        # thing nobody does. A node id here turns that into minutes, and the
        # sandbox this repository is developed in cannot run the tier at all
        # (see CLAUDE.md), so this is the only way a new slow case gets checked
        # before the next scheduled run.
        description: "pytest selection: -m slow, or a node id"
        default: "-m slow"

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"
      # Through the environment rather than interpolated into the command, so the
      # input is an argument and not a fragment of shell. The fallback is for the
      # scheduled path, where ``inputs`` is empty.
      - env:
          SELECTION: ${{ inputs.selection || '-m slow' }}
        run: pytest $SELECTION -q -n auto --durations=20
