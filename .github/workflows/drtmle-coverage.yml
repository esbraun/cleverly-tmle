name: drtmle-coverage

# Dispatch only, with no schedule, for the reason `drtmle-convergence.yml` is: this is a
# study rather than a check. It asserts nothing, its output is a set of tables a human
# reads against the rules frozen in docs/drtmle/validation-plan.md section 5, and the
# nightly tier must not absorb it -- a tier that silently grew a half-hour study would be
# a tier nobody dispatches.
#
# **Both tiers run from here**, and which one a dispatch chose is the first thing to read off
# its log. Tier 1 (benchmarks/drtmle_injection.py) hands the estimator a prescribed nuisance
# sequence, so "the intended asymptotic regime was entered" is true by construction and is
# **not** an applied claim; tier 2 (benchmarks/drtmle_tier2.py) fits both nuisances, with the
# good one a smoother whose bandwidth sequence was committed before any fit, and **is** the
# demonstration. The remainder columns item 13 asks for -- `P_0 D-hat` at an independent
# draw -- come from `--evaluation-n` and are available at either tier.
#
# The environment this repository is developed in cannot run a pilot (see CLAUDE.md), so this
# is how piece C's numbers get produced.
#
# **Read the pre-flight table first.** It is the last one printed and it is the gate on the
# 250-replicate dispatch: docs/drtmle/coverage-study.md's repair section states three
# conditions, none of them a coverage study, and section 5 requires they pass *before* a run
# rather than be inferred from one afterwards. C3a's pilot is what that rule is written from --
# it dispatched 600 fits against a design whose drift the targeting step was absorbing whole,
# and no other table on this page would have said so.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: "space-separated: q-drift g-drift (both is the design; one is a debug run)"
        default: "q-drift g-drift"
      sizes:
        description: "space-separated sample sizes; three carry a rate, two are suggestive"
        default: "600 1200 2400"
      replicates:
        description: >-
          draws per (cell, size). 50 is the pilot; the frozen study wants 250 at minimum and
          500 if the budget reaches -- a coverage estimate's Monte Carlo standard error is
          0.014 at 250 and 0.010 at 500, so 250 resolves 0.95-against-0.88 and does not
          resolve 0.95-against-0.93
        default: "50"
      seed:
        description: >-
          the study's own seed. A different value is the independent second batch section 5
          requires, and it is to be run *after* the first is complete rather than beside it
        default: "20250801"
      jobs:
        description: "parallel draws; each fit is single-threaded, and 2 fits the runner"
        default: "2"
      tier:
        description: >-
          1 is the prescribed nuisance sequence and is not the demonstration; 2 is the
          prescribed-rate learners and is. Both report the same tables
        default: "1"
      evaluation_n:
        description: >-
          rows of the independent draw P_0 D-hat is integrated over -- item 13's instrument,
          a quadrature rule rather than a sample size, so it appears in no root-n scaling.
          0 turns the remainder columns off
        default: "2000"
      rows:
        description: "also print every replicate, not just the per-cell tables"
        type: boolean
        default: false

jobs:
  # One job to turn a space-separated input into a matrix, because there is no expression
  # that splits a string and every attempt to write one is unreadable. `jq` does it in a
  # line, and the input never reaches a shell as anything but an argument.
  plan:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.split.outputs.cells }}
    steps:
      - id: split
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          printf 'cells=' >> "$GITHUB_OUTPUT"
          jq -cRn 'env.CELLS | split(" ") | map(select(length > 0))' >> "$GITHUB_OUTPUT"

  # A matrix over the cells, which is the axis that parallelises without splitting a
  # comparison: both estimators of a pair are fitted in the same worker on the same draw, so
  # the paired shortfall is computed inside a job and never across two. Splitting by *size*
  # as well would shard the rate columns, which are read down a cell.
  study:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    # A tier-1 pair (TMLE plus DRTMLE) measured at ~2.4s on a four-core container and a
    # **tier-2** pair at 5.4s to 7.4s per fit at n = 600 -- against the 43s per DRTMLE fit
    # docs/roadmap.md costed piece C from, which is the re-timing that piece asks for before
    # C is re-scoped. So the pilot stays well inside this cap at either tier. Generous rather
    # than tight, and for the sharper reason `drtmle-convergence.yml` gives: the script prints
    # nothing until every draw has returned, so a run killed at the cap reports no table at
    # all rather than a partial one.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      # Through the environment rather than interpolated into the command, so the inputs are
      # arguments and not fragments of shell -- `nightly.yml` and `drtmle-convergence.yml`
      # say the same.
      # `bash` rather than the default `bash -e {0}`, which has no `pipefail`: the study is
      # piped through `tee`, so without it a crashed run exits on `tee`'s zero and reports a
      # **green job with a truncated log and no JSONL**. That is the worst failure mode
      # available to the one run on this page whose cost makes redoing it a decision rather
      # than an errand -- a silent partial study reads exactly like a complete one.
      - shell: bash -euo pipefail {0}
        env:
          CELL: ${{ matrix.cell }}
          SIZES: ${{ inputs.sizes }}
          REPLICATES: ${{ inputs.replicates }}
          SEED: ${{ inputs.seed }}
          JOBS: ${{ inputs.jobs }}
          TIER: ${{ inputs.tier }}
          EVALUATION_N: ${{ inputs.evaluation_n }}
          ROWS: ${{ inputs.rows && '--rows' || '' }}
        run: >
          python benchmarks/drtmle_coverage.py
          --cells "$CELL"
          --sizes $SIZES
          --replicates "$REPLICATES"
          --seed "$SEED"
          --jobs "$JOBS"
          --tier "$TIER"
          --evaluation-n "$EVALUATION_N"
          $ROWS
          | tee "coverage-$CELL.log"

      # Where a reader will see it without opening a job log, `numba-benchmark.yml`'s pattern.
      - name: Post the tables to the run summary
        if: always()
        env:
          CELL: ${{ matrix.cell }}
        run: |
          {
            echo "## drtmle-coverage: tier ${{ inputs.tier }}, $CELL"
            echo '```text'
            cat "coverage-$CELL.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Section 5 asks for the per-replicate results and not only the summary tables, and
      # `benchmarks/results/` is git-ignored generated output -- a file from a two-core runner
      # reads as a fact about the package rather than about that box. So it travels as an
      # artefact, which is where a rerun's numbers can be compared against this one's.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-coverage-${{ matrix.cell }}
          path: |
            benchmarks/results/drtmle-coverage/
            coverage-${{ matrix.cell }}.log
          retention-days: 90
