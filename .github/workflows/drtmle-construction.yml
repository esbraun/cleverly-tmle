name: drtmle-construction

# Dispatch only, with no schedule, for the reason every other study workflow here is: this is a
# measurement rather than a check. It asserts nothing, and its output is a set of tables a human
# reads against the rules frozen in docs/drtmle/validation-plan.md section 9.
#
# **Piece F4**: six construction contrasts, one factor each, on two disjoint cohorts of draws.
# It closes nothing on its own and it **may not branch** -- only F7 may change `src/`. Final
# coverage is in neither diagnostic; that is F8's and only F8's.
#
# **The preregistration is a commit and this workflow depends on it.** `--phase run` calls
# `validate_prereg` before it fits anything and exits non-zero if the committed manifest's rule,
# configuration or cohorts disagree with the code it is running against. Freeze first:
#
#     python -m benchmarks.drtmle_construction --phase prereg --out evidence/f4-construction
#     git add evidence/f4-construction/prereg.json && git commit
#
# **Read the arm table before the contrast table.** The contrasts are paired differences and a
# contrast whose two arms did not both produce a row on a draw contributes nothing from it; the
# arm table's `draws` column is what says whether that happened.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: >-
          selection or audit. **Disjoint sets of draws**, and the audit is what an effect has to
          reproduce on -- an effect assessed on the draws that produced it has not reproduced.
          Run selection first and read it before dispatching audit
        default: "selection"
      cells:
        description: "space-separated: q-drift g-drift (both is the design; one is a debug run)"
        default: "q-drift g-drift"
      sizes:
        description: >-
          space-separated. Both is the design. The two carry **different** committed draw counts
          -- see SIZE_DRAWS -- because n=2400 resolves the declared margin and n=600 does not:
          n=600 is powered for `moved` and not for `flat`, which the manifest declares rather
          than the result discovering
        default: "600 2400"
      draws:
        description: >-
          DEBUG ONLY. Empty takes each size's committed count from the frozen manifest, which is
          what a dispatch does. A value truncates the cohort and makes the run a smoke test
        default: ""
      arms:
        description: >-
          space-separated subset of: cleverly r-style paper no-close nested loose. All six is
          the design; a subset drops whichever contrasts it breaks the pairing of
        default: "cleverly r-style paper no-close nested loose"
      quadrature_points:
        description: >-
          Sobol points of the evaluation rule P_0 D-hat is integrated on, per scramble. 2048 is
          the frozen value. Measured at under 3% effect on every paired spread against 512, so
          this is not the knob a noisy column is fixed with -- the size is
        default: "2048"
      jobs:
        description: "parallel draws; each fit is single-threaded, and 2 fits the runner"
        default: "2"
      seed:
        description: "the study's own seed, and the one the frozen cohorts were spawned from"
        default: "20250801"

jobs:
  # The truncation contrast, which is F4's sixth factor and is **not** a cohort of draws: the
  # tier-2 law's initial mechanism has a clip share of 0.0000 even at a bound of (0.15, 0.85),
  # so the two arms are bit-identical on this study's own draws and a cohort of them would
  # report a null on a contrast that could not have been non-null. Read exactly on the two
  # frozen trace fixtures instead -- one job, no seeds, a few seconds.
  truncation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      - shell: bash -euo pipefail {0}
        run: |
          python -m benchmarks.drtmle_construction --phase truncation \
            | tee construction-truncation.log
      - name: Post the reading to the run summary
        if: always()
        run: |
          {
            echo "## drtmle-construction: the truncation contrast, read exactly"
            echo '```text'
            cat construction-truncation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-construction-truncation
          path: construction-truncation.log
          retention-days: 90

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      # One job per (cell, size). Splitting by size as well as by cell is what keeps each job
      # inside its timeout: n=2400 carries more than three times n=600's committed draws and
      # each of its fits is dearer, so a job holding both would be most of the study.
      - id: split
        env:
          CELLS: ${{ inputs.cells }}
          SIZES: ${{ inputs.sizes }}
        run: |
          printf 'matrix=' >> "$GITHUB_OUTPUT"
          jq -cn '[
            (env.CELLS | split(" ") | map(select(length > 0))[]) as $cell
            | (env.SIZES | split(" ") | map(select(length > 0))[]) as $size
            | {cell: $cell, size: $size}
          ]' >> "$GITHUB_OUTPUT"

  contrasts:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Six arms a draw, each a full alternation whose rounds refit three reduced regressions.
    # Measured at 5-13s a fit on four cores, so 80 draws at n=2400 is about an hour at
    # --jobs 2. Generous rather than tight, for the reason drtmle-coverage.yml gives: the
    # script prints nothing until every draw has returned.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
      # `bash -euo pipefail` rather than the default, since the run is piped through `tee`:
      # without it a crashed run exits on `tee`'s zero and reports a green job with a truncated
      # log -- and a `--phase run` that fails validation exits NON-ZERO on purpose, which
      # `tee`'s status would swallow.
      - shell: bash -euo pipefail {0}
        env:
          COHORT: ${{ inputs.cohort }}
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
          ARMS: ${{ inputs.arms }}
          DRAWS: ${{ inputs.draws }}
          POINTS: ${{ inputs.quadrature_points }}
          JOBS: ${{ inputs.jobs }}
          SEED: ${{ inputs.seed }}
        run: |
          # `--draws` is omitted rather than passed empty, so the committed per-size count is
          # what runs unless a debug value was given.
          extra=()
          if [ -n "$DRAWS" ]; then extra+=(--draws "$DRAWS"); fi
          python -m benchmarks.drtmle_construction \
            --phase run \
            --prereg evidence/f4-construction/prereg.json \
            --cohort "$COHORT" \
            --cells "$CELL" \
            --sizes "$SIZE" \
            --arms $ARMS \
            --quadrature-points "$POINTS" \
            --jobs "$JOBS" \
            --seed "$SEED" \
            "${extra[@]}" \
            | tee "construction-$COHORT-$CELL-$SIZE.log"

      - name: Post the tables to the run summary
        if: always()
        env:
          COHORT: ${{ inputs.cohort }}
          CELL: ${{ matrix.cell }}
          SIZE: ${{ matrix.size }}
        run: |
          {
            echo "## drtmle-construction: $COHORT, $CELL, n = $SIZE"
            echo '```text'
            cat "construction-$COHORT-$CELL-$SIZE.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The per-replicate rows are the evidence and the tables are a transcription of them.
      # The log also carries the contrast rows as a digest plus gzipped bytes, because the
      # environment this study is dispatched from cannot reach artefact storage --
      # scripts/recover_construction.sh is what takes them back out, and it refuses a
      # reconstruction whose SHA-256 does not match.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-construction-${{ inputs.cohort }}-${{ matrix.cell }}-${{ matrix.size }}
          path: |
            benchmarks/results/drtmle-construction/
            construction-${{ inputs.cohort }}-${{ matrix.cell }}-${{ matrix.size }}.log
          retention-days: 90
