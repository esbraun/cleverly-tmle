# The performance tiers of the numba investigation.
#
# The *correctness* tier is deliberately not here: it lives in
# `tests/unit/test_numba_benchmark.py` and runs in the ordinary fast tier on every pull
# request, because whether a compiled kernel computes what numpy computes is a correctness
# question and belongs where correctness questions are checked. What is here is the part
# that cannot go there -- timing, which a shared GitHub runner measures badly and which
# nobody should be able to make a pull request red with.
#
# Two tiers, and the split is about what a number from each is worth:
#
#   `smoke`      -- one representative kernel per estimator flavour, small, with a
#                   deliberately wide regression bar. It answers "did something become
#                   catastrophically slower", not "is this fast". Dispatchable manually.
#   `full`       -- the whole sweep from benchmarks/configs/full.yaml, dispatch only,
#                   uploading the artefacts. GitHub's runners are shared virtual machines
#                   with two cores and noisy neighbours, so a scaling table from one is
#                   worth reading for its *shape* and not for its numbers; the job says so
#                   in its own summary rather than leaving a reader to infer it.
#
# The `full` job takes its core counts from the config, which is what makes it the full
# tier. It used to pass `--num-cores 1 2` as well, and that flag *replaces* the config's
# list rather than narrowing it -- so `full.yaml`'s `[1, 2, 4, 8]` was discarded and no job
# in this file had ever run above two cores, while the reports read as though a full sweep
# had. On the default runner the 4- and 8-core rows now come back as
# `skipped_reason = "asked for 4 cores; the box has 2"`, which is `resources.py`'s refusal
# working rather than a gap, and the summary tables them. Point `runner:` at a box with
# cores to spare to have them measured; `num_cores:` still overrides for a one-off. (Named
# with an underscore, not a hyphen: `inputs.num-cores` in an expression parses as a
# subtraction rather than as a property.)
#
# Results are never compared across runs as though the hardware were the same. Every
# artefact carries `environment.json`, and the summary carries the CPU model.
name: numba-benchmark

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [smoke, full]
        default: smoke
      kernels:
        description: Space-separated kernel names, or "all"
        type: string
        default: all
      runner:
        description: Runner label for the full tier -- a box with cores to spare
        type: string
        default: ubuntu-latest
      num_cores:
        description: Space-separated core counts for the full tier, or empty for the config's
        type: string
        default: ""

concurrency:
  group: numba-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.tier == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: bench

      # `--num-cores 1 2` is right *here* and stays: this job passes no `--config`, so
      # `Config()`'s default of (1, 2, 4) would produce a skipped four-core row every week
      # on a two-core runner. The full tier below is the one that must not override.
      - name: Kernels, small, at every core count the runner has
        run: |
          python -m benchmarks.numba.cli \
            --kernel ${{ inputs.kernels || 'all' }} \
            --sizes 20000 \
            --num-cores 1 2 \
            --repeats 5 \
            --warmups 3 \
            --output benchmarks/results

      - name: Cold-compile times, in a fresh process per kernel
        run: python -m benchmarks.numba.cli --cold-compile --kernel all

      - name: Post the summary where a reader will see it
        run: cat benchmarks/results/latest/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: numba-benchmark-smoke
          path: benchmarks/results/latest/
          retention-days: 30

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    # Dispatch-only, which also keeps a self-hosted `runner:` off the pull-request path.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: bench

      # pyyaml is not a dependency of this repository and is not going to become one for a
      # benchmark's sake; the config loader takes JSON too. Installed here so the *full*
      # config, which is YAML because it is meant to be read and edited, loads.
      - run: uv pip install pyyaml

      # No `--num-cores` unless one is dispatched: the config's own `num_cores` is the full
      # tier's core list, and a flag here would replace it rather than narrow it.
      - name: The whole sweep
        run: |
          python -m benchmarks.numba.cli \
            --config benchmarks/configs/full.yaml \
            ${{ inputs.num_cores && format('--num-cores {0}', inputs.num_cores) || '' }} \
            --output benchmarks/results

      - name: The complete post-nuisance pipelines, at both learner presets
        run: |
          python -m benchmarks.numba.cli \
            --pipelines \
            --pipeline-libraries glm default \
            --pipeline-n 20000 \
            --output benchmarks/results

      - name: Cold-compile times
        run: python -m benchmarks.numba.cli --cold-compile --kernel all

      - name: Post the summaries
        run: |
          {
            echo "> Measured on \`${{ inputs.runner || 'ubuntu-latest' }}\`. Read the scaling"
            echo "> tables for their shape, not their numbers, and never against a run from"
            echo "> other hardware -- see environment.json in the artefact."
            echo ">"
            echo "> Core counts come from benchmarks/configs/full.yaml. Rows above what the"
            echo "> box can serve are **skipped rather than capped**, and are tabled as such"
            echo "> below -- a two-core runner answers nothing about 4 or 8."
            echo
            cat benchmarks/results/latest/summary.md
            echo
            cat benchmarks/results/latest/pipelines.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: numba-benchmark-full
          path: benchmarks/results/latest/
          retention-days: 90
