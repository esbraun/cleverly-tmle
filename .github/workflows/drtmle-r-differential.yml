name: drtmle-r-differential

# Piece F3: the bounded differential run against the published `drtmle` R package.
#
# Dispatch only, and **isolated on purpose**. `docs/roadmap.md`'s F3 row forbids an R
# dependency "in the package, in `nox`, or in any test tier the fast CI runs", so R lives
# here and nowhere else: no other workflow installs it, `pyproject.toml` names nothing, and
# `benchmarks/drtmle_r_compare.py` -- the half of this that is tested -- reads an R run off
# disk and never invokes one.
#
# What it produces is a *question*, not a verdict. A divergence is adjudicated against
# Theorem 1, `docs/drtmle/theorem-concordance.md`, the exact-law identities and the remainder
# decomposition -- never by which side R is on. Changing this package to match R is stop-ship
# 17, and agreement here is not a release criterion. See `CLAUDE.md`'s
# *A differential diagnostic against R, refused, then authorized*.
#
# It is a separate workflow rather than a job on `nightly.yml` for the reason
# `drtmle-convergence.yml` gives about itself, plus one of its own: this installs a second
# language toolchain, and a nightly that did that would pay for it every night to answer a
# question that is asked once per construction change.
on:
  workflow_dispatch:
    inputs:
      qsteps:
        description: "drtmle's outcome-update route: 2 is its default (fluctuateQ2 then fluctuateQ1), 1 is the joint solve"
        default: "2"
      max_iter:
        description: "drtmle's maxIter. Its own default is 3, which is a cap rather than a tolerance -- gate 4 fails when the run reaches it"
        default: "3"
      orders:
        description: "which of this package's update orders to compare against, space-separated"
        default: "cleverly paper"

jobs:
  differential:
    runs-on: ubuntu-latest
    # The R side fits nothing primary -- the fixture's `Qn` and `gn` are handed in -- so the
    # run itself is seconds. What the cap is for is the toolchain: `np` compiles, and it
    # pulls `crs` and `quantreg` with it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Named exactly, and the reason is the same one `pyproject.toml`'s pinned ruff has:
      # a package the comparison is against, resolved to "whatever CRAN has today", turns a
      # divergence into something with no commit to blame. `SuperLearner` and `np` are
      # `drtmle`'s own imports and are installed whether or not this run fits with them --
      # the reduced regressions here are `glm_Qr`/`glm_gr`, so neither is called.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::drtmle
            any::digest
          cache-version: 1

      - name: record the R toolchain
        run: |
          Rscript -e 'cat(R.version.string, "\n")'
          Rscript -e 'cat("drtmle", as.character(packageVersion("drtmle")), "\n")'

      - name: trace the R package on the frozen fixture
        env:
          QSTEPS: ${{ inputs.qsteps }}
          MAX_ITER: ${{ inputs.max_iter }}
        run: >
          Rscript benchmarks/r/drtmle_reference.R
          --fixture benchmarks/fixtures/drtmle_trace_v1.csv
          --manifest benchmarks/fixtures/drtmle_trace_v1.json
          --out benchmarks/results/r-trace
          --qsteps "$QSTEPS"
          --max-iter "$MAX_ITER"

      - name: align the two trajectories and name the first divergence
        env:
          ORDERS: ${{ inputs.orders }}
        run: >
          python -m benchmarks.drtmle_r_compare
          --export benchmarks/results/r-trace
          --orders $ORDERS
          --out benchmarks/results/r-differential.md
          --json benchmarks/results/r-differential.json

      # The report is the deliverable -- F3's acceptance is "one checked-in comparison report
      # naming the first divergence or establishing agreement to a declared tolerance". The
      # blob travels with it because a reader who wants to re-run a gate needs the state, and
      # `benchmarks/results/` is not committed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drtmle-r-differential
          path: benchmarks/results/
          retention-days: 30

      - name: print the report into the job summary
        if: always()
        run: cat benchmarks/results/r-differential.md >> "$GITHUB_STEP_SUMMARY"
