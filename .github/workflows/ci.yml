name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, not `@latest`: a formatter release can turn this job red with no commit
      # to blame, and it has -- 0.16 began formatting the Python blocks inside Markdown,
      # which here means README.md, CLAUDE.md and everything under docs/.
      # Bump it deliberately, in step with the `ruff==` pin in pyproject's `dev` extra, so
      # that `ruff format --check .` run locally is the same check that runs here.
      - run: uv tool run ruff@0.16.1 check .
      - run: uv tool run ruff@0.16.1 format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The install steps live in the composite action; it says why they are what they are.
      # `mypy` is pinned for the reason the ruff version above is: `mypy>=1.11` resolved to
      # whatever was current, and a release that tightens a check -- or a dependency that
      # ships better stubs -- turns this job red with no commit to blame. Bump it
      # deliberately, in step with pyproject's `dev` extra and `noxfile.py`.
      #
      # The interpreter matches `[tool.mypy]`'s `python_version`, which is `3.12` and says at
      # length why it is not the `3.11` of `requires-python`: numpy's stubs use PEP 695 `type`
      # statements, which a 3.11 target refuses to parse. Running the job on the interpreter it
      # targets keeps the two from drifting apart silently. **3.11 is still supported and still
      # tested** -- the `tests` matrix below runs the fast tier on it.
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"
          extra: all
          packages: mypy==1.19.1
      - run: mypy src/cleverly

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # The matrix version is threaded through to `uv venv --python`; without that, every
      # row of the matrix would install into `/usr`'s interpreter and exercise the same one.
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
      # `-n auto` resolves through psutil, else `os.cpu_count()` -- neither of which reads a
      # container's CFS quota, so on a quota-limited runner it asks for the *host's* cores.
      # `tests.parallel` goes through joblib/loky, which does read it.
      - name: Size the worker pool from the cores this job may actually use
        run: |
          echo "PYTEST_XDIST_AUTO_NUM_WORKERS=$(python -m tests.parallel --workers)" >> "$GITHUB_ENV"
          python -m tests.parallel
      # Behavioral examples belong in this fast unit/integration/e2e tier. Documentation
      # is reviewed only through the manually dispatched documentation workflow.
      - run: pytest -m "not slow" -q -n auto

  # The numba benchmark's *correctness* tier. It lives in `tests/unit/` and would
  # therefore run in the `tests` job above -- except that `tests` installs `.[dev]`, which
  # deliberately does not carry numba, so the module `importorskip`s and the tier passes by
  # not running. A skipped correctness check reads exactly like a passing one in the log,
  # which is the failure mode this job exists to remove.
  #
  # `.[bench]` rather than adding numba to `dev`: numba is a compiler toolchain and a
  # hundred megabytes, and nothing under `src/` imports it. One job pays for it.
  numba-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: bench
          # Unpinned and unbounded on purpose: the composite action interpolates this
          # into an unquoted shell word, so a `>=` here would be parsed as a redirect and
          # install nothing while reporting success. The floors that matter are in the
          # `dev` extra; this job only needs pytest to exist.
          packages: pytest pytest-xdist
      # Two threads, not one: the property most worth checking here is that a parallel
      # kernel's answer does not move with the thread count, and a single-threaded runner
      # cannot check it. `-p no:randomly` is not needed -- the module sets the count itself.
      - run: pytest tests/unit/test_numba_benchmark.py -q
        env:
          NUMBA_NUM_THREADS: "2"

  # One backend at a time, which the `tests` job above cannot check: it installs `.[dev]`,
  # which pulls pandas *and* polars, so the single-backend and neither-installed branches of
  # `cleverly.utils.frames` had never executed anywhere. That is how `make_longitudinal_weighted`
  # came to hard-code `backend="pandas"` and call `.loc` -- unusable on a polars-only install,
  # and invisible to a suite that always had both.
  #
  # The test suite itself imports pandas and polars freely, so it cannot be the check here.
  # What runs instead is the import and a fit end to end through the one backend present.
  minimal-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pandas, polars]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: ${{ matrix.backend }}
      - name: A fit, its reports and the generators, on one backend
        run: python scripts/smoke_backend.py ${{ matrix.backend }}
