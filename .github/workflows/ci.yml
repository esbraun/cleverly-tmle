name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, not `@latest`: a formatter release can turn this job red with no commit
      # to blame, and it has -- 0.16 began formatting the Python blocks inside Markdown,
      # which here means README.md, CLAUDE.md and everything under docs/.
      # Bump it deliberately, in step with the `ruff==` pin in pyproject's `dev` extra, so
      # that `ruff format --check .` run locally is the same check that runs here.
      - run: uv tool run ruff@0.16.1 check .
      - run: uv tool run ruff@0.16.1 format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The install steps live in the composite action; it says why they are what they are.
      # `mypy` is pinned for the reason the ruff version above is: `mypy>=1.11` resolved to
      # whatever was current, and a release that tightens a check -- or a dependency that
      # ships better stubs -- turns this job red with no commit to blame. Bump it
      # deliberately, in step with pyproject's `dev` extra and `noxfile.py`.
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: all
          packages: mypy==1.19.1
      - run: mypy src/cleverly

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # The matrix version is threaded through to `uv venv --python`; without that, every
      # row of the matrix would install into `/usr`'s interpreter and exercise the same one.
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest -m "not slow" -q -n auto

  # One backend at a time, which the `tests` job above cannot check: it installs `.[dev]`,
  # which pulls pandas *and* polars, so the single-backend and neither-installed branches of
  # `cleverly.utils.frames` had never executed anywhere. That is how `make_longitudinal_weighted`
  # came to hard-code `backend="pandas"` and call `.loc` -- unusable on a polars-only install,
  # and invisible to a suite that always had both.
  #
  # The test suite itself imports pandas and polars freely, so it cannot be the check here.
  # What runs instead is the import and a fit end to end through the one backend present.
  minimal-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pandas, polars]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          extra: ${{ matrix.backend }}
      - name: A fit, its reports and the generators, on one backend
        run: python scripts/smoke_backend.py ${{ matrix.backend }}
