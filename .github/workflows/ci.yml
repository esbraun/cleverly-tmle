name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, not `@latest`: a formatter release can turn this job red with no commit
      # to blame, and it has -- 0.16 began formatting the Python blocks inside Markdown,
      # which here means README.md, CLAUDE.md and everything under docs/.
      # Bump it deliberately, in step with the `ruff==` pin in pyproject's `dev` extra, so
      # that `ruff format --check .` run locally is the same check that runs here.
      - run: uv tool run ruff@0.16.1 check .
      - run: uv tool run ruff@0.16.1 format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      # A virtual environment rather than `--system`, and the reason is not only that
      # `--system` stopped working. `ubuntu-latest`'s Debian Python is marked externally
      # managed (PEP 668), so `uv pip install --system` is now refused outright -- which
      # turned every job in this file except `lint` red, with no commit to blame, and kept
      # them red while the merges went on. But `--system` was the wrong instrument even
      # while it worked: it installs into whichever interpreter `/usr` holds, *not* the one
      # `uv python install` just placed, so the version above and the version tested were
      # only ever the same by accident. `uv venv --python` makes them the same by
      # construction, which is what the matrix in `tests` actually needs.
      - run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Pinned for the reason the ruff version above is: `mypy>=1.11` resolved to whatever
      # was current, and a release that tightens a check -- or a dependency that ships
      # better stubs -- turns this job red with no commit to blame. Bump it deliberately.
      - run: uv pip install -e ".[all]" "mypy==1.19.1"
      - run: mypy src/cleverly

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      # `--python` threaded through from the matrix, for the reason `typecheck` above sets
      # out: without it this job installs into `/usr`'s interpreter and every row of the
      # matrix exercises the same one.
      - run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e ".[dev]"
      - run: pytest -m "not slow" -q -n auto
