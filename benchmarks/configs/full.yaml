# The full sweep. Hours on a quiet machine with cores to spare; not for a shared box.
#
# `num_cores` should name the *physical* core counts of the machine this runs on, up to
# and including all of them. NUMBA_NUM_THREADS is set from the largest value here before
# numba is imported, so a value the box cannot serve is refused rather than silently
# capped -- which is what makes an efficiency column trustworthy.
sizes: [10000, 100000, 1000000]
num_cores: [1, 2, 4, 8]
repeats: 10
warmups: 3
min_total_seconds: 2.0
seed: 20260803
validate: true
memory: true
amortise: true
kernels: [all]

sweeps:
  # The number of estimands is the plan's headline hypothesis for the fused curves, and
  # the reason to sweep it rather than fix it: if the gain is flat in the estimand count
  # then the fusion is not what is buying it.
  fused_influence_curves:
    n_estimands: [1, 3, 5, 7]
    regime: [good, severe]

  # The walk length is the dimension, not the row count: the per-step cost scales with n
  # and the step count scales with how far the fluctuation has to travel.
  one_step_walk:
    n_arms: [2, 5]
    regime: [good, moderate, severe]
    max_steps: [200, 2000]

  # Cluster count and size profile both matter, and for different reasons: the count sets
  # the thread-local accumulator's memory and the profile sets the load balance.
  cluster_sums:
    n_clusters: [100, 1000, 5000, 100000]
    n_estimands: [1, 5, 20]
    shape: [balanced, poisson, skewed]

  multiplier_bootstrap:
    n_replicates: [500, 2000, 10000]
    n_estimands: [5, 20]
    chunk: [64, 256, 1024]

  ltmle_backward_recursion:
    n_times: [2, 5, 10, 25]
    n_regimens: [2, 5, 20]
    dynamic: [false, true]

  survival_incidence:
    n_times: [20, 100]
    n_causes: [1, 2]
    n_horizons: [1, 10, 0]

  ctmle_candidate_scores:
    n_candidates: [10, 50, 200]
    n_folds: [2, 5, 10]

  drtmle_reduction_rounds:
    n_rounds: [4, 16]
    regime: [moderate, severe]
