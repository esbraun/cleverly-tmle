[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cleverly"
dynamic = ["version"]
description = "A Python toolbox for causal studies based on targeted maximum likelihood estimation (TMLE)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Eric Braun" }]
keywords = [
    "tmle",
    "targeted-learning",
    "causal-inference",
    "double-robust",
    "super-learner",
    "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # 2.x, not the 1.9 this used to floor at: the arrow-backed and nullable dtypes are a
    # tested configuration now, and `nw.DataFrame.schema`/`Series.cast`/`Series.is_null`
    # behaving as the ingestion path assumes is 2.x behaviour. A floor fifteen minor
    # versions below the locked version is not a floor, it is a guess.
    "narwhals>=2.0",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
plot = ["matplotlib>=3.7"]
all = ["cleverly[pandas,polars,plot]"]
docs = [
    "cleverly[all]",
    "numpydoc>=1.10,<2",
    "sphinx>=8.1,<9",
    "myst-parser>=4.0,<5",
    "myst-nb>=1.2,<2",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinx-copybutton>=0.5,<0.6",
    "sphinx-design>=0.6,<1",
]
dev = [
    "cleverly[all]",
    "numpydoc>=1.10,<2",
    "pyarrow>=15",
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "build>=1.2,<2",
    "twine>=7,<8",
    # Exact pins live here and in uv.lock. CI and nox install this extra rather than
    # restating versions, so local and automated toolchains resolve from one declaration.
    "ruff==0.16.1",
    "mypy==1.19.1",
    "nox>=2024.3",
]

[project.urls]
Homepage = "https://esbraun.github.io/cleverly-tmle/"
Documentation = "https://esbraun.github.io/cleverly-tmle/"
Repository = "https://github.com/esbraun/cleverly-tmle"
Issues = "https://github.com/esbraun/cleverly-tmle/issues"

[tool.hatch.version]
path = "src/cleverly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cleverly"]

[tool.hatch.build.targets.wheel.force-include]
"src/cleverly/py.typed" = "cleverly/py.typed"

# The project is MIT, but `tests/canonical/` is GPL-3.0: its R runners call reference
# packages in-process, and one of them is AGPL-3. Keeping the test tree out of the sdist
# is what makes "a default install is MIT" true rather than merely intended. The wheel
# target above already excludes it. Excluded whole rather than at `tests/canonical/`,
# because `tests/unit/test_method_evidence.py` and every `tests/studies/canonical_*.py`
# read the artifacts there; a partial tree collects as errors, not as a runnable suite.
[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "NPY",
]
ignore = [
    "E741",   # ambiguous variable names: `l` is idiomatic for lower bounds here
    "B008",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
# `3.12` rather than the `3.11` in `requires-python`, and that gap is forced rather than
# chosen. `mypy` applies this target when it *parses* every file it reads, third-party stubs
# included, and numpy ships PEP 695 `type` statements in `numpy/__init__.pyi` from 2.5 --
# which under `python_version = "3.11"` is `error: Type statement is only supported in Python
# 3.12 and greater`, raised against numpy's own stub and aborting the run before a line of
# this package is checked. It is not a statement about this code, and there is no per-file
# escape from it.
#
# What that costs here is nothing measurable: `src/cleverly` carries no `sys.version_info`
# branch for `mypy` to evaluate differently at one target than another, so 3.11, 3.12 and
# 3.13 checked the same 80 files identically until numpy's stub stopped parsing. Runtime
# support for 3.11 is unchanged and is enforced where it always was -- the `PYTHONS` matrix
# in `noxfile.py` and the `tests` job in CI both run the fast tier on 3.11.
#
# So `3.12` is the *oldest target that still parses*, which keeps as much of the original
# intent -- check against the floor -- as the dependency allows. Lower it again if numpy's
# stubs ever stop needing 3.12. The `mypy==` pin itself has not moved; it lives once in the
# `dev` extra above, which `noxfile.py` and `ci.yml` install rather than restate.
python_version = "3.12"
# `scripts/` is in scope deliberately.  Nothing under it is imported by a test, so the
# type checker is the only gate it has -- and the one that catches a script still calling
# a result method the package has removed.
files = ["src/cleverly", "scripts"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
