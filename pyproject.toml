[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cleverly"
version = "0.1.0"
description = "Targeted maximum likelihood estimation (TMLE) for Python, with first-class sensitivity analysis and validation diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Eric Braun" }]
keywords = [
    "tmle",
    "targeted-learning",
    "causal-inference",
    "double-robust",
    "super-learner",
    "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "narwhals>=1.9",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
boost = ["lightgbm>=4.0"]
plot = ["matplotlib>=3.7"]
all = ["cleverly[pandas,polars,boost,plot]"]
dev = [
    "cleverly[all]",
    "pyarrow>=15",
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    # Pinned exactly, and kept in step with .github/workflows/ci.yml. A range would let a
    # local `ruff format --check .` pass against a formatter CI does not run: 0.16 began
    # formatting the Python blocks inside Markdown, so the two disagreed about README.md
    # and now about docs/*.md as well.
    "ruff==0.16.1",
    "mypy==1.19.1",
    "nox>=2024.3",
]

[project.urls]
Homepage = "https://github.com/esbraun/cleverly-tmle"
Repository = "https://github.com/esbraun/cleverly-tmle"

[tool.hatch.build.targets.wheel]
packages = ["src/cleverly"]

[tool.hatch.build.targets.wheel.force-include]
"src/cleverly/py.typed" = "cleverly/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: statistical validation runs (coverage, consistency, type I error); excluded from the fast CI tier",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "NPY",
]
ignore = [
    "E741",   # ambiguous variable names: `l` is idiomatic for lower bounds here
    "B008",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/cleverly"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
