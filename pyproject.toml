[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cleverly"
version = "0.1.0"
description = "Targeted maximum likelihood estimation (TMLE) for Python, with first-class sensitivity analysis and validation diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Eric Braun" }]
keywords = [
    "tmle",
    "targeted-learning",
    "causal-inference",
    "double-robust",
    "super-learner",
    "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # 2.x, not the 1.9 this used to floor at: the arrow-backed and nullable dtypes are a
    # tested configuration now, and `nw.DataFrame.schema`/`Series.cast`/`Series.is_null`
    # behaving as the ingestion path assumes is 2.x behaviour. A floor fifteen minor
    # versions below the locked version is not a floor, it is a guess.
    "narwhals>=2.0",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
boost = ["lightgbm>=4.0"]
plot = ["matplotlib>=3.7"]
all = ["cleverly[pandas,polars,boost,plot]"]
# Benchmarking only, and deliberately not part of `all`. `numba` is here for the two
# instruments that measure it: `benchmarks/bench_tmle.py`, which times one compiled
# targeting kernel against the numpy one, and `benchmarks/numba/`, which asks the same
# question of every post-nuisance kernel in the package with the learner fits excluded.
# Nothing under `src/` imports it. Whether it is worth taking as a runtime dependency is
# kernel-by-kernel rather than package-wide -- docs/benchmarks/README.md records the
# evidence and docs/roadmap.md, *Native acceleration*, is the current verdict.
#
# `tests/unit/test_numba_benchmark.py` needs this extra, which is why CI has a job that
# installs it: under `dev` that module skips, and a skipped correctness check reads like a
# passing one.
bench = ["cleverly[all]", "numba>=0.60"]
dev = [
    "cleverly[all]",
    "pyarrow>=15",
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    # Pinned exactly, and kept in step with .github/workflows/ci.yml. A range would let a
    # local `ruff format --check .` pass against a formatter CI does not run: 0.16 began
    # formatting the Python blocks inside Markdown, so the two disagreed about README.md
    # and now about docs/*.md as well.
    "ruff==0.16.1",
    "mypy==1.19.1",
    "nox>=2024.3",
]

[project.urls]
Homepage = "https://github.com/esbraun/cleverly-tmle"
Repository = "https://github.com/esbraun/cleverly-tmle"

[tool.hatch.build.targets.wheel]
packages = ["src/cleverly"]

[tool.hatch.build.targets.wheel.force-include]
"src/cleverly/py.typed" = "cleverly/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: statistical validation runs (coverage, consistency, type I error); excluded from the fast CI tier",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "NPY",
]
ignore = [
    "E741",   # ambiguous variable names: `l` is idiomatic for lower bounds here
    "B008",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
# `3.12` rather than the `3.11` in `requires-python`, and that gap is forced rather than
# chosen. `mypy` applies this target when it *parses* every file it reads, third-party stubs
# included, and numpy ships PEP 695 `type` statements in `numpy/__init__.pyi` from 2.5 --
# which under `python_version = "3.11"` is `error: Type statement is only supported in Python
# 3.12 and greater`, raised against numpy's own stub and aborting the run before a line of
# this package is checked. It is not a statement about this code, and there is no per-file
# escape from it.
#
# What that costs here is nothing measurable: `src/cleverly` carries no `sys.version_info`
# branch for `mypy` to evaluate differently at one target than another, so 3.11, 3.12 and
# 3.13 checked the same 80 files identically until numpy's stub stopped parsing. Runtime
# support for 3.11 is unchanged and is enforced where it always was -- the `PYTHONS` matrix
# in `noxfile.py` and the `tests` job in CI both run the fast tier on 3.11.
#
# So `3.12` is the *oldest target that still parses*, which keeps as much of the original
# intent -- check against the floor -- as the dependency allows. Lower it again if numpy's
# stubs ever stop needing 3.12. The `mypy==` pin itself has not moved, and still matches
# `noxfile.py` and `ci.yml`.
python_version = "3.12"
files = ["src/cleverly"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
